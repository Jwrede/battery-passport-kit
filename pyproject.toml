[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-passport-kit"
version = "0.1.0"
description = "Create, validate and inspect EU battery passports with the BatteryPass-Ready data model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jonathan Wrede" }]
dependencies = ["jsonschema>=4.18", "segno>=1.5"]
keywords = ["battery passport", "digital product passport", "DPP", "EU 2023/1542", "battery regulation"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
bpkit = "bpkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpkit"]

[tool.ruff]
line-length = 120
