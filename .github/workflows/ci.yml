name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: ruff check .
      - run: ruff format --check .
      - name: Example from the README
        run: |
          bpkit categories
          bpkit from-csv examples/ev-feb27.csv --category ev -o /tmp/passports
          bpkit validate /tmp/passports/EXC77-000001.json
          ! bpkit report /tmp/passports/EXC77-000002.json
